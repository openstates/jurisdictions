[project]
name = "jurisdictions"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4.1",
    "google-i18n-address>=3.1.1",
    "httpx[http2]>=0.28.1",
    "pandas>=2.3.2",
    "polars>=1.33.1",
    "pyarrow>=21.0.0",
    "pyaml>=25.7.0",
    "pydantic>=2.11.9",
    "rapidfuzz>=3.0.0",
    "rich>=14.0.0",
    "tqdm>=4.68.1",
    "google-genai>=2.17.0",
    "openai>=2.53.0",
    "python-dotenv>=1.2.2",
    "ddgs>=9.14.4",
]

[project.optional-dependencies]
# Local model runtimes. Install with `uv sync --extra local` (or
# `pip install '.[local]'`). Only needed if you plan to call
# `src.clients.ollama.generate()`; the commercial LLM clients
# (Gemini/OpenAI) and search clients (DDG/Brave) work without this.
local = [
    "ollama>=0.6.2",
    # Future: add `llama-cpp-python` here if we wire a llama.cpp client.
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "respx>=0.22.0",
    "ruff>=0.13.2",
    "pytest-pythonpath>=0.7",
    "hypothesis>=6.151.11",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "asyncio: marks tests as asyncio-based async tests",
]
addopts = [
    "--strict-markers",
    "--verbose",
    "--color=yes",
]
