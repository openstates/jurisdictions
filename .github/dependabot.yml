version: 2

updates:
  # Python dependencies (pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Batch routine bumps into one PR; security updates still open
    # individually so a vulnerability fix is never held up by a group.
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Actions pinned in .github/workflows/*.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
