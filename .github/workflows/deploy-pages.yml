name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "data/parquet/**"
      - "pages/**"
      - "src/utils/build_pages_data.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # data/parquet/ is committed pipeline output, split by state so populate
      # PRs don't clash. The site loads faster from one file per table, so
      # combine them here and write manifest.json from the combined files.
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - run: uv sync --all-extras

      - name: Build Parquet data into pages/data
        run: uv run python -m src.utils.build_pages_data --src data/parquet --out pages/data

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
