name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "data/parquet/**"
      - "pages/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # data/parquet/ is committed pipeline output (produced by a maintainer
      # running the pipeline locally, not generated here) — no Python/DuckDB
      # step needed, just place it where the site expects to find it.
      - name: Stage Parquet data into pages/data
        run: |
          mkdir -p pages/data
          cp -r data/parquet/. pages/data/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
